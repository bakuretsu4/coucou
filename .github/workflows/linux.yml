name: Linux

# Builds and tests the Linux app (linux/). Nothing is published from here.

on:
  push:
    paths:
      - 'linux/**'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'linux/**'
      - '.github/workflows/linux.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linux/package-lock.json

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-layer-shell-dev \
            libayatana-appindicator3-dev libdbus-1-dev librsvg2-dev libsoup-3.0-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            linux/target
          key: linux-cargo-${{ hashFiles('linux/Cargo.lock') }}
          restore-keys: linux-cargo-

      - run: npm ci
      - run: npm run build          # type-check, bundle, build coucou-hook
      - run: cargo test
      - run: cargo build --release -p coucou --features custom-protocol
