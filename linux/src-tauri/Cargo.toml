[package]
name = "coucou"
description = "Coucou for Linux — Mochi lives on the edge of your screen"
authors = ["Louis Raille"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "coucou_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Serve the bundled frontend instead of the dev server. `tauri build` turns this
# on; it is spelled out so a plain `cargo build --features custom-protocol` works.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
libc = "0.2"

# The island is a Wayland layer-shell surface (X11 gets a plain undecorated
# window). Versions match the gtk-rs 0.18 that Tauri 2 uses.
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
